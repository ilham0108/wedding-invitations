<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Round photo frame: a thin ring with cream blossoms and leaves on both lower sides. The opening fits a photo inset 12%. -->
  <defs>
    <g id="petal">
      <path d="M0 0C-12-9-13-29 0-39 13-29 12-9 0 0Z"/>
    </g>
    <g id="blossom">
      <g fill="#fbf7ef" stroke="#b6a184" stroke-width="1.8">
        <use href="#petal"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#d8c08f"/>
      <circle r="3" fill="#b3955f"/>
    </g>
    <g id="leaf">
      <path d="M0 0C14-5 32-5 46 3 32 11 14 9 0 0Z" fill="#cdbfa9" stroke="#a6957b" stroke-width="1.4"/>
      <path d="M2 1C16 2 30 3 44 3" fill="none" stroke="#a6957b" stroke-width="1"/>
    </g>
    <g id="spray">
      <path d="M0 0C-10-40-6-90 20-130" fill="none" stroke="#a6957b" stroke-width="2"/>
      <use href="#leaf" transform="translate(-4 -30) rotate(-150)"/>
      <use href="#leaf" transform="translate(-4 -60) rotate(-20)"/>
      <use href="#leaf" transform="translate(0 -90) rotate(-160) scale(0.85)"/>
      <use href="#leaf" transform="translate(8 -112) rotate(-40) scale(0.75)"/>
      <use href="#blossom" transform="translate(6 8) scale(1.15)"/>
      <use href="#blossom" transform="translate(-26 -40) scale(0.75) rotate(25)"/>
      <use href="#blossom" transform="translate(22 -128) scale(0.5) rotate(-20)"/>
      <g fill="#e6d8bf" stroke="#b6a184" stroke-width="1.2">
        <circle cx="30" cy="-12" r="5"/>
        <circle cx="38" cy="-2" r="4"/>
      </g>
    </g>
  </defs>

  <circle cx="200" cy="200" r="182" fill="none" stroke="#c9b493" stroke-width="2"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#c9b493" stroke-width="0.8" stroke-dasharray="2 6"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#spray" transform="translate(58 330) rotate(-35)"/>
    <use href="#spray" transform="translate(342 330) scale(-1 1) rotate(-35)"/>
  </g>
</svg>
