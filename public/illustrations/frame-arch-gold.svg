    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d39a"/>
      <stop offset="0.5" stop-color="#b8904a"/>
      <stop offset="1" stop-color="#8a6a32"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" stroke-linejoin="round">
    <path d="M44 444V212a156 156 0 0 1 312 0v232Z" stroke-width="10"/>
    <path d="M30 458V212a170 170 0 0 1 340 0v246Z" stroke-width="3"/>
  </g>
